# creating pv is a k8 admin job.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ebs-static
spec:
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain # Retain means don't delete data. Recycle means delete data but don't delete disk.Delete means delete the data.
  capacity:
    storage: 15Gi
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-034e20f531f8c30c7
    
