apiVersion: v1 
kind: Pod
metadata: 
  name: emptydir-demo
  namespace: default
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:  
    - mountPath: /var/log/nginx
      name: nginx-logs

  - name: almalinux
    image: almalinux:9  
    command: ["sleep", "1000"]
    volumeMounts:  
    - mountPath: /mnt/nginx-log
      name: nginx-logs
      readOnly: true # almalinux can not make any changes. it can only read the logs.
  volumes: 
  - name: nginx-logs
    emptyDir:
     sizeLimit: 100Mi
